; PlatformIO Project Configuration File for ESP32-S3 AI Desktop Pet Robot
; High-performance C++20 firmware configuration with 16MB Quad-SPI Flash and 8MB Octal-SPI PSRAM

[platformio]
default_envs = esp32-s3-n16r8
src_dir = src
include_dir = include

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Architecture & Clock Speeds
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Flash & PSRAM Architecture (N16R8 = 16MB Flash QIO, 8MB PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

; Compiler flags for deterministic C++20, max optimization, PSRAM cache errata mitigation, and package include paths
build_flags =
    -std=gnu++2a
    -O3
    -DESP32S3_N16R8
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Iinclude
    -I../packages/protocol/include
    -I../packages/widget-schema/include
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -Os

; Open-source vendor dependencies for Agentic discovery, BLE GATT, WebSockets, and Storage
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
    FS
    LittleFS
    SD
    SPI

; Vendor libraries pre-build hook
extra_scripts = pre:scripts/fetch_vendor_libs.py

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time, colorize
